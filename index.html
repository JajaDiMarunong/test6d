<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WebAR 6DoF Real-to-Virtual Walking Explorer</title>
    <meta name="description" content="Walk in the real world to explore a 3D low-poly floating island with WebXR 6DoF tracking, sensor pedometer fusion, and rear camera safety preview." />
    <meta property="og:title" content="WebAR 6DoF Real-to-Virtual Walking Explorer" />
    <meta property="og:description" content="Walk in the real world to explore a 3D low-poly floating island with WebXR 6DoF tracking, sensor pedometer fusion, and rear camera safety preview." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      // Ensure trailing slash for GitHub Pages relative asset imports
      (function() {
        var p = window.location.pathname;
        if (p.length > 1 && !p.endsWith('/') && !p.includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();

      // Global error listener to display errors on phone screens without devtools
      window.addEventListener('error', function(e) {
        var el = document.getElementById('debug-err');
        var spin = document.getElementById('loading-spinner');
        if (el) {
          el.style.display = 'block';
          el.innerText = 'Error: ' + (e.message || e.toString()) + '\nSource: ' + (e.filename || '') + ':' + (e.lineno || '');
        }
        if (spin) spin.style.borderColor = '#ef4444';
      });

      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('debug-err');
        if (el) {
          el.style.display = 'block';
          el.innerText = 'Promise Rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-white m-0 p-0 overflow-hidden">
    <div id="root">
      <!-- Fast initial loader before React hydrates -->
      <div style="position:fixed;inset:0;background:#0b1120;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;padding:24px;text-align:center;">
        <div id="loading-spinner" style="width:48px;height:48px;border:3px solid rgba(6,182,212,0.2);border-top-color:#06b6d4;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
        <div style="font-weight:700;font-size:17px;letter-spacing:-0.02em;margin-bottom:6px;">WebAR 6DoF Walking Explorer</div>
        <div style="font-size:12px;color:#94a3b8;max-width:280px;line-height:1.4;">Connecting walking engine & 3D world...</div>

        <!-- Debug error display if script fails -->
        <div id="debug-err" style="display:none;margin-top:20px;padding:12px;background:#450a0a;border:1px solid #dc2626;color:#fecaca;border-radius:12px;font-size:11px;font-family:monospace;max-width:320px;word-break:break-word;text-align:left;"></div>

        <button onclick="window.location.reload(true)" style="margin-top:20px;padding:8px 16px;background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:8px;font-size:11px;cursor:pointer;">
          Tap to Reload
        </button>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatic fallback for static GitHub Pages root deployments:
      // If /src/main.tsx fails (404 on static hosts), automatically load precompiled production bundle!
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.querySelector('#loading-spinner')) {
          console.warn('/src/main.tsx unavailable on static host. Loading precompiled production bundle...');
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/app.js';
          document.body.appendChild(s);

          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.crossOrigin = 'anonymous';
          l.href = './assets/app.css';
          document.head.appendChild(l);
        }
      }, 500);
    </script>
  </body>
</html>
