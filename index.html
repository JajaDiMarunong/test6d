<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WebAR 6DoF Real-to-Virtual Walking Explorer</title>
    <meta name="description" content="Walk in the real world to explore a 3D low-poly floating island with WebXR 6DoF tracking, sensor pedometer fusion, and rear camera safety preview." />
    <meta property="og:title" content="WebAR 6DoF Real-to-Virtual Walking Explorer" />
    <meta property="og:description" content="Walk in the real world to explore a 3D low-poly floating island with WebXR 6DoF tracking, sensor pedometer fusion, and rear camera safety preview." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      // Ensure trailing slash for GitHub Pages relative asset imports
      (function() {
        var p = window.location.pathname;
        if (p.length > 1 && !p.endsWith('/') && !p.includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-white m-0 p-0 overflow-hidden">
    <div id="root">
      <!-- Fast initial loader before React hydrates -->
      <div style="position:fixed;inset:0;background:#0b1120;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;padding:20px;text-align:center;">
        <div style="width:48px;height:48px;border:3px solid rgba(6,182,212,0.2);border-top-color:#06b6d4;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
        <div style="font-weight:700;font-size:16px;letter-spacing:-0.02em;margin-bottom:6px;">WebAR 6DoF Walking Explorer</div>
        <div style="font-size:12px;color:#94a3b8;">Loading 3D floating world...</div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
